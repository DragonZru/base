      data-id: seata.properties
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 124.70.186.54:8848
      group: SEATA_GROUP
      namespace: seata
      cluster: default
      username: nacos
      password: Guyuefangyuan6
