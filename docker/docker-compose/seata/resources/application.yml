seata:
  config:
    type: nacos
    nacos:
      server-addr: 124.70.186.54:8848
      namespace: seata
      group: SEATA_GROUP
      username: nacos
      password: Guyuefangyuan6
      context-path:
      ##if use MSE Nacos with auth, mutex with username/password attribute
      #access-key:
