services:   
  redis-cluster-1:
    image: redis:7.2.7
    container_name: node-1
    ports:
      - "6371:6371"
      - "16371:16371"
    volumes:
      - ./redis-1.conf:/etc/redis/redis.conf
    command: sh -c "redis-server /etc/redis/redis.conf"
    networks:
      - redis_default
   
  redis-cluster-2:
    image: redis:7.2.7
    container_name: node-2
    ports:
      - "6372:6372"
      - "16372:16372"
    volumes:
      - ./redis-2.conf:/etc/redis/redis.conf
    command: sh -c "redis-server /etc/redis/redis.conf"
    depends_on:
      - redis-cluster-1
    networks:
      - redis_default
    
  redis-cluster-3:
    image: redis:7.2.7
    container_name: node-3
    ports:
      - "6373:6373"
      - "16373:16373"
    volumes:
      - ./redis-3.conf:/etc/redis/redis.conf
    command: sh -c "redis-server /etc/redis/redis.conf"
    depends_on:
      - redis-cluster-2
    networks:
      - redis_default
    
  redis-cluster-4:
    image: redis:7.2.7
    container_name: node-4
    ports:
      - "6374:6374"
      - "16374:16374"
    volumes:
      - ./redis-4.conf:/etc/redis/redis.conf
    command: sh -c "redis-server /etc/redis/redis.conf"
    depends_on:
      - redis-cluster-3
    networks:
      - redis_default
      
  redis-cluster-5:
    image: redis:7.2.7
    container_name: node-5
    ports:
      - "6375:6375"
      - "16375:16375"
    volumes:
      - ./redis-5.conf:/etc/redis/redis.conf
    command: sh -c "redis-server /etc/redis/redis.conf"
    depends_on:
      - redis-cluster-4
    networks:
      - redis_default
      
  redis-cluster-6:
    image: redis:7.2.7
    container_name: node-6
    ports:
      - "6376:6376"
      - "16376:16376"
    volumes:
      - ./redis-6.conf:/etc/redis/redis.conf
    command: sh -c "redis-server /etc/redis/redis.conf"
    depends_on:
      - redis-cluster-5
    networks:
      - redis_default

networks:
  redis_default:
    external: true
