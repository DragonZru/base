services:
  mysql:
    image: mysql:8.0.32
    container_name: mysql
    ports:
      - 3306:3306
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
      - ./init-scripts:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
#    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    networks:
      - base

  nacos:
    image: nacos/nacos-server:v2.5.0
    container_name: nacos
    volumes:
      - ./nacoslogs/:/home/nacos/logs
#    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: 123456
      MYSQL_SERVICE_DB_PARAM: allowPublicKeyRetrieval=true
      NACOS_AUTH_ENABLE: true
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: Guyuefangyuan6
      #base64 encode（secret）and secret must be 32 byte or larger
      NACOS_AUTH_TOKEN: ZGE2YWUyZDVlYWFiNDY2ZWJmNDY4NmYyZDg3N2FkMWY=
    depends_on:
      - mysql
    networks:
      - base
      
  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: seata
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
#      - SEATA_IP=124.70.186.54
      - SEATA_PORT=8091
    volumes:
      - "/usr/share/zoneinfo/Asia/Shanghai:/etc/localtime"        #设置系统时区
      - "/usr/share/zoneinfo/Asia/Shanghai:/etc/timezone"  #设置时区
      - "./resources:/seata-server/resources"
      - "./seatalogs:/root/logs/seata"
#    restart: always
    depends_on:
      - nacos
    networks:
      - base
      
